<body class="border-0 bd-example">

  <nav class="navbar navbar-nav container-fluid">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="images/logo.png" alt="logo" width="200" height="150">
      </a>
      <button class="navbar-toggler gradient-btn" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

  <header>
    <h1 class="text-center text-uppercase fw-bold gradient-text">Contact</h1>
  </header>
  <div class="container">
    <div class="row">
      <main class="contact-wrapper col-md-9">
        <form name="contact" method="POST" netlify class="contact-form">
        <p>
          <label>Naam: <input type="text" name="name" /></label>
        </p>
        <p>
          <label>E-mail: <input type="email" name="email" /></label>
        </p>
        <p>
          <label>Bericht: <textarea name="message"></textarea></label>
        </p>
        <p>
          <button class="gradient-btn rounded" type="submit">Send</button>
        </p>
        </form>
      </main>
      <aside class="col-md-3">
      <ul class="list-inline socials list-group list-group-horizontal border-0 pt-3">
          <a href="https://www.linkedin.com/in/matthijs-dhooge/" target="_blank">
            <i class="bi bi-linkedin mx-5"></i>
          </a>
            <a href="https://github.com/MatthijsdHooge" target="_blank">
            <i class="bi bi-github"></i>
            </a>
      </ul>
      <p></p>
        <div id="map"></div>
        <figcaption>&copy;leaflet</figcaption>
      </aside>

    </div>

  <footer class="container-fluid text-center h6 p-4 ">&copy; <span id="year"></span> d'Hooge Matthijs</footer>
